name: Fact Desk Feed Health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * *"
  push:
    branches:
      - chatgpt/fact-desk-recovery
    paths:
      - "src/data/rssFeeds.ts"
      - "src/lib/ingest/rss.ts"
      - "scripts/check-rss-feeds.ts"
      - ".github/workflows/feed-health.yml"

permissions:
  contents: read

jobs:
  check-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check configured feeds
        run: npm run check:feeds
