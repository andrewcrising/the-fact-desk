name: Fact Desk CI

on:
  push:
    branches:
      - main
      - chatgpt/fact-desk-recovery
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application with Next.js
        run: npm run build

      - name: Build application for Cloudflare Workers
        run: npm run build:vinext

      - name: Validate Cloudflare Worker bundle
        run: npx wrangler deploy --dry-run --config dist/server/wrangler.json
