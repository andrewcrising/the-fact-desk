name: Cloudflare migration bootstrap

on:
  push:
    branches:
      - chatgpt/fact-desk-recovery
    paths:
      - .github/workflows/cloudflare-migration-bootstrap.yml

permissions:
  contents: write

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out recovery branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/fact-desk-recovery
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Check vinext compatibility
        run: npx --yes vinext@latest check | tee vinext-compatibility.txt

      - name: Initialize Cloudflare Workers support
        run: npx --yes vinext@latest init --platform=cloudflare --skip-check

      - name: Validate existing tests
        run: npm test

      - name: Validate lint
        run: npm run lint

      - name: Validate original Next.js build
        run: npm run build

      - name: Validate Cloudflare vinext build
        run: npm run build:vinext

      - name: Commit generated migration files
        run: |
          rm -f vinext-compatibility.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated migration changes to commit."
            exit 0
          fi
          git commit -m "Add Cloudflare Workers migration scaffold"
          git push origin HEAD:chatgpt/fact-desk-recovery
