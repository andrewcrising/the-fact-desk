name: Fact Desk Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  run-briefing-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Validate secrets
        env:
          FACT_DESK_SITE_URL: ${{ secrets.FACT_DESK_SITE_URL }}
          FACT_DESK_CRON_SECRET: ${{ secrets.FACT_DESK_CRON_SECRET }}
        run: |
          if [ -z "$FACT_DESK_SITE_URL" ]; then
            echo "Missing required secret: FACT_DESK_SITE_URL" >&2
            exit 1
          fi
          if [ -z "$FACT_DESK_CRON_SECRET" ]; then
            echo "Missing required secret: FACT_DESK_CRON_SECRET" >&2
            exit 1
          fi

      - name: Trigger automation pipeline
        env:
          FACT_DESK_SITE_URL: ${{ secrets.FACT_DESK_SITE_URL }}
          FACT_DESK_CRON_SECRET: ${{ secrets.FACT_DESK_CRON_SECRET }}
        run: |
          set -euo pipefail
          URL="${FACT_DESK_SITE_URL%/}/api/automation/run-briefing-pipeline"
          RESPONSE_FILE="$(mktemp)"
          STATUS="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            -X POST "$URL" \
            -H "Authorization: Bearer ${FACT_DESK_CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --data '{"dry_run":false}')"

          echo "Automation endpoint status: $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Automation request failed. Response:" >&2
            cat "$RESPONSE_FILE" >&2
            exit 1
          fi

          echo "Automation response:"
          cat "$RESPONSE_FILE"
